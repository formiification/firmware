; The very slick RAK wireless RAK 4631 / 4630 board - Unified firmware for 5005/19003, with or without OLED RAK 1921
[env:rak4631]
custom_meshtastic_hw_model = 9
custom_meshtastic_hw_model_slug = RAK4631
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = RAK WisBlock 4631
custom_meshtastic_images = rak4631.svg, rak4631_case.svg
custom_meshtastic_tags = RAK

extends = nrf52840_base
board = wiscore_rak4631
board_level = pr
build_type = release
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/rak4631
  -D RAK_4631
  -DMESHTASTIC_USE_EINK_UI=0
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  -DRADIOLIB_EXCLUDE_LR2021=1
  ; RAK12022 PT100 (MAX31865) on the IO slot SPI; wire count must match the module's J2/J3/J4 jumpers
  -DMAX31865_CS=26
  -DMAX31865_SPI=SPI1
  -DMAX31865_WIRES=3
build_src_filter = ${nrf52_base.build_src_filter} \
  +<../variants/nrf52840/rak4631> \
  +<mqtt/> \
  -<graphics/EInkDisplay2.cpp> \
  -<graphics/EInkDynamicDisplay.cpp> \
  -<graphics/fonts/EinkDisplayFonts.cpp>
lib_deps =
  ${nrf52840_base.lib_deps}
  # renovate: datasource=custom.pio depName=Melopero RV3028 packageName=melopero/library/Melopero RV3028
  melopero/Melopero RV3028@1.2.0
  # renovate: datasource=custom.pio depName=RAK NCP5623 RGB LED packageName=rakwireless/library/RAKwireless NCP5623 RGB LED library
  rakwireless/RAKwireless NCP5623 RGB LED library@1.0.3
  # renovate: datasource=git-refs depName=RAK12034-BMX160 packageName=https://github.com/RAKWireless/RAK12034-BMX160 gitBranch=main
  https://github.com/RAKWireless/RAK12034-BMX160/archive/dcead07ffa267d3c906e9ca4a1330ab989e957e2.zip
  ; TODO: Replace with RAKWireless-official when https://github.com/RAKWireless/RAK12035_SoilMoisture/pull/3 is merged
  https://github.com/vidplace7/RAK12035_SoilMoisture/archive/56594a0c918460b48ba6ff0b16c06a75f75e7a40.zip
  # renovate: datasource=github-tags depName=Adafruit MAX31865 packageName=adafruit/Adafruit_MAX31865
  https://github.com/adafruit/Adafruit_MAX31865/archive/refs/tags/1.6.2.zip

; Tiny router builds (fork): stripped RAK4631 firmware for fixed infrastructure nodes,
; small enough (~400-435 KB) that a compressed update image can be staged in internal
; flash next to the running one for FOTA over LoRa. -gps keeps the GPS module, -sht adds environment
; telemetry with only the Sensirion SHT driver (RAK1901 / SHTC3).
[tiny_router_excludes]
build_flags =
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  -DMESHTASTIC_EXCLUDE_SCREEN_MIRROR=1
  -DMESHTASTIC_EXCLUDE_INPUTBROKER=1
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1
  -DMESHTASTIC_EXCLUDE_AUDIO=1
  -DMESHTASTIC_EXCLUDE_RTTTL=1
  -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -DMESHTASTIC_EXCLUDE_ATAK=1
  -DMESHTASTIC_EXCLUDE_DROPZONE=1
  -DMESHTASTIC_EXCLUDE_POWERSTRESS=1
  -DMESHTASTIC_EXCLUDE_POWERMON=1
  -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  -DMESHTASTIC_EXCLUDE_REPLYBOT=1

[tiny_router_no_env_sensors]
build_flags =
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL=1

; Every environment sensor library except arduino-sht: their drivers compile only when the header is found.
[tiny_router_sht_only]
lib_ignore =
  Adafruit ADS1X15
  Adafruit AHTX0
  Adafruit BME280 Library
  Adafruit BME680 Library
  Adafruit BMP085 Library
  Adafruit BMP280 Library
  Adafruit BMP3XX Library
  Adafruit DPS310
  Adafruit DS248x
  Adafruit INA219
  Adafruit INA260 Library
  Adafruit LPS2X
  Adafruit LTR390 Library
  Adafruit MAX1704X
  Adafruit MCP9808 Library
  Adafruit MLX90614 Library
  Adafruit PCT2075
  Adafruit SPA06_003
  Adafruit TSL2561
  Adafruit TSL2591 Library
  Adafruit VEML7700 Library
  BH1750_WE
  ClosedCube OPT3001
  DFRobot_LarkWeatherStation
  DFRobot_RainfallSensor
  DFRobot_RTU
  EmotiBit MLX90632
  Grove - Laser PM2.5 Sensor HM3301
  INA226
  INA3221
  RAK12035_SoilMoisture
  Sensirion I2C SCD30
  Sensirion I2C SCD4x
  Sensirion I2C SFA3x
  SparkFun AS3935 Lightning Detector Arduino Library
  SparkFun MAX3010x Pulse and Proximity Sensor Library
  SparkFun Qwiic Scale NAU7802 Arduino Library

[env:rak4631-tiny-router-gps]
extends = env:rak4631
board_level = extra
custom_meshtastic_display_name = RAK WisBlock 4631 Tiny Router (GPS)
build_flags =
  ${env:rak4631.build_flags}
  ${tiny_router_excludes.build_flags}
  ${tiny_router_no_env_sensors.build_flags}
  -DMESHTASTIC_LORA_OTA=1
extra_scripts =
  ${nrf52_base.extra_scripts}
  extra_scripts/lora_ota_ram_guard.py ; post-link: the installer must run entirely from RAM
lib_deps =
  ${env:rak4631.lib_deps}
  # renovate: datasource=git-refs depName=ota-common packageName=https://github.com/caveman99/ota-common gitBranch=master
  https://github.com/caveman99/ota-common/archive/e0d0e37d23a21df093981b40a09b454b9ce1c327.zip

[env:rak4631-tiny-router]
extends = env:rak4631-tiny-router-gps
custom_meshtastic_display_name = RAK WisBlock 4631 Tiny Router
build_flags =
  ${env:rak4631-tiny-router-gps.build_flags}
  -DMESHTASTIC_EXCLUDE_GPS=1

[env:rak4631-tiny-router-sht-gps]
extends = env:rak4631-tiny-router-gps
custom_meshtastic_display_name = RAK WisBlock 4631 Tiny Router (SHT, GPS)
build_flags =
  ${env:rak4631.build_flags}
  ${tiny_router_excludes.build_flags}
  -DMESHTASTIC_LORA_OTA=1
lib_ignore =
  ${env:rak4631-tiny-router-gps.lib_ignore}
  ${tiny_router_sht_only.lib_ignore}

[env:rak4631-tiny-router-sht]
extends = env:rak4631-tiny-router-sht-gps
custom_meshtastic_display_name = RAK WisBlock 4631 Tiny Router (SHT)
build_flags =
  ${env:rak4631-tiny-router-sht-gps.build_flags}
  -DMESHTASTIC_EXCLUDE_GPS=1

; RAK10728 WisMesh Repeater Mini V2 (RAK4631 + RAK19003 + solar battery + GPS module)
[env:rak_wismesh_repeater_mini]
extends = env:rak4631
board_level = release
custom_meshtastic_display_name = RAK WisMesh Repeater Mini V2
custom_meshtastic_images = rak4631.svg
build_flags =
  ${env:rak4631.build_flags}
  -D WISMESH_REPEATER_MINI
  -DLOW_VDD_SYSTEMOFF_DELAY_MS=5000
  -DSAFE_VDD_VOLTAGE_THRESHOLD_MV=2900
  -DSAFE_VDD_VOLTAGE_THRESHOLD_HYST_MV=100

; RAK WisMesh Pocket V3 - rak4631 pin map + OLED; no ethernet (unlike env:rak4631)
[env:rak_wismesh_pocket]
extends = env:rak4631
board_level = release
custom_meshtastic_display_name = RAK WisMesh Pocket V3
custom_meshtastic_images = rak_wismesh_pocket.svg
build_flags =
  ${env:rak4631.build_flags}
  -D WISMESH_POCKET
  -DLOW_VDD_SYSTEMOFF_DELAY_MS=5000
  -DSAFE_VDD_VOLTAGE_THRESHOLD_MV=2900
  -DSAFE_VDD_VOLTAGE_THRESHOLD_HYST_MV=100
; env:rak4631 no longer pulls in mesh/eth or mesh/api, so the negations that used to live
; here are redundant -- this env now inherits an Ethernet-free src filter with MQTT retained,
; unchanged.

; If not set we will default to uploading over serial (first it forces bootloader entry by talking 1200bps to cdcacm)
; Note: as of 6/2013 the serial/bootloader based programming takes approximately 30 seconds
;upload_protocol = jlink

; Allows programming and debug via the RAK NanoDAP as the default debugger tool for the RAK4631 (it is only $10!)
; programming time is about the same as the bootloader version.
; For information on this see the meshtastic developers documentation for "Development on the NRF52"
[env:rak4631_dbg]
extends = env:rak4631
board_level = extra

; if the builtin version of openocd has a buggy version of semihosting, so use the external version
; platform_packages = platformio/tool-openocd@3.1200.0

build_flags =
  ${env:rak4631.build_flags}
  -D USE_SEMIHOSTING

lib_deps =
  ${env:rak4631.lib_deps}
  # TODO renovate
  https://github.com/geeksville/Armduino-Semihosting/archive/35b538fdf208c3530c1434cd099a08e486672ee4.zip

; NOTE: the pyocd support for semihosting is buggy.  So I switched to using the builtin platformio support for the stlink adapter which worked much better.
; However the built in openocd version in platformio has buggy support for TCP to semihosting. 
;
; So I'm now trying the external openocd - but the openocd scripts for nrf52.cfg assume you are using a DAP adapter not an STLINK adapter.
; In theory I could change those scripts.  But for now I'm trying going back to a DAP adapter but with the external openocd.

upload_protocol = stlink
; eventually use platformio/tool-pyocd@2.3600.0 instad
;upload_protocol = custom
;upload_command = pyocd flash -t nrf52840 $UPLOADERFLAGS $SOURCE
